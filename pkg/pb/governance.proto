syntax="proto3";

package governance_pb;

option go_package = "github.com/Resolyte-official/service-governance/pkg/pb";

service Governance {
    rpc ServiceStatus (ServiceStatusRequest) returns (ServiceStatusResponse) {}
    rpc Authenticate (AuthenticateRequest) returns (AuthenticateResponse) {}
    rpc Authorize (AuthorizeRequest) returns (AuthorizeResponse) {}
}

message Claims {
    string sub = 1;
    string aud = 2;
    string iss = 3;
    int64 iat = 4;
    int64 exp = 5;
    string type = 6;
}

message ServiceStatusRequest {}
message ServiceStatusResponse {
    int64 status = 1;
}

message AuthenticateRequest {
    string token = 1;
}
message AuthenticateResponse {
    Claims claims = 1;
    int64 status = 2;
    string err = 3;
    // in future, we can send claims like sub, aud, iat etc
}

message AuthorizeRequest {
    string token = 1;
    string obj = 2;
    string act = 3;
}
message AuthorizeResponse {
    bool eft = 1;
    Claims claims = 2;
    int64 status = 3;
    string err = 4;
}