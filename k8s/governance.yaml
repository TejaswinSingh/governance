apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: governance
  template:
    metadata:
      labels:
        app: governance
    spec:
      containers:
        - name: governance
          image: resolyte/service-governance:latest
          ports:
            - containerPort: 12001
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: governance-service
spec:
  type: NodePort
  selector:
    app: governance
  ports:
    - name: http
      port: 12001
      targetPort: 12001
      nodePort: 30100
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30101