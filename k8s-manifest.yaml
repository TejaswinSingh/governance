apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENV: development
  HTTPS: "false"
  GOVERNANCE_HTTP_PORT: "12001"
  GOVERNANCE_GRPC_PORT: "9090"
  CORS_ORIGIN: http://127.0.0.1:5500
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  REDIS_DATABASE_GOVERNANCE: "0"
  MONGO_HOST: mongo-service
  MONGO_PORT: "27017"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-deployment
  labels:
    app: governance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: governance
  template:
    metadata:
      labels:
        app: governance
    spec:
      containers:
        - name: governance
          image: resolyte/service-governance:latest
          ports:
            - containerPort: 12001
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: governance-service
spec:
  type: NodePort
  selector:
    app: governance
  ports:
    - name: http
      port: 12001
      targetPort: 12001
      nodePort: 30100
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongodb/mongodb-community-server:8.0.8-ubuntu2204
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          emptyDir: {} # ephemeral storage
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.2
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: REDIS_PASSWORD
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  SECRET_KEY: bXktc2VjcmV0LWtleQ==
  REDIS_PASSWORD: bXlyZWRpc3Bhc3N3b3Jk
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  MONGO_INITDB_ROOT_PASSWORD: bXltb25nb3Bhc3N3b3Jk
---
