server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-logs
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            # time: time
            # message: message
            service: service
            context: context
            method: method
            transport: transport
            path: path
            # rpc: rpc
            status: status
            # duration: duration
            request_id: request_id
            user_id: user_id
            error: error
            # trace: trace
      - labels:
          service:
          context:
          method:
          transport:
          path:
          status:
          request_id:
          user_id:
          level:
          error: