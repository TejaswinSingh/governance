openapi: 3.1.0
info:
  title: Governance API
  version: 1.0.0
  description: API for authentication and authorization

servers:
  - url: http://localhost:12001
    description: Local server

paths:
  /healthz:
    get:
      summary: Check service health
      security:
        - authCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestIDHeader'
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /login:
    post:
      summary: User login
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: Successful login
          headers:
            Set-Cookie:
              description: |
                Sets `access_token` and `refresh_token` cookies.
                HttpOnly, Secure, SameSite=Strict
              schema:
                type: array
                items:
                  type: string
                example:
                  - access_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
                  - refresh_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
        "400":
          description: Bad request (missing or invalid credentials)
        "401":
          description: Unauthorized

  /logout:
    post:
      summary: User logout
      security:
        - authCookie: []
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestIDHeader'
      responses:
        "200":
          description: Successfully logged out
          headers:
            Set-Cookie:
              description: |
                Clears `access_token` and `refresh_token` cookies by setting them
                with an expired date and Max-Age=0.
              schema:
                type: array
                items:
                  type: string
                example:
                  - access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; HttpOnly; Secure; SameSite=Strict
                  - refresh_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /refresh:
    post:
      summary: Refresh access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestIDHeader'
      responses:
        "200":
          description: Token refreshed
          headers:
            Set-Cookie:
              description: |
                Sets `access_token` and `refresh_token` cookies.
                HttpOnly, Secure, SameSite=Strict
              schema:
                type: array
                items:
                  type: string
                example:
                  - access_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
                  - refresh_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  securitySchemes:
    authCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    RequestIDHeader:
      name: X-REQUEST-ID
      in: header
      required: true
      description: Unique request identifier
      schema:
        type: string
