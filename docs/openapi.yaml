openapi: 3.1.0
info:
  title: Governance API
  version: 1.0.0
  description: API for authentication and authorization

servers:
  - url: http://localhost:12001
    description: Local server

paths:
  /governance/healthz:
    get:
      summary: Check service health
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: Successful login
          headers:
            Authorization:
              description: Bearer access token
              schema:
                type: string
            X-Refresh-Token:
              description: Refresh token for future authentication
              schema:
                type: string
                example: abcdef123456
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
        "400":
          description: Bad request (missing or invalid credentials)
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      summary: User logout
      security:
        - bearerAuth: []
        - refreshHeaderAuth: []
      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /auth/refresh:
    post:
      summary: Refresh access token
      security:
        - refreshHeaderAuth: []
      responses:
        "200":
          description: Token refreshed
          headers:
            Authorization:
              description: Bearer new access token
              schema:
                type: string
            X-Refresh-Token:
              description: New refresh token
              schema:
                type: string
                example: newtoken123456
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshHeaderAuth:
      type: apiKey
      in: header
      name: X-Refresh-Token
