openapi: 3.1.0
info:
  title: AUTH API
  version: 1.0.0
  description: API for authentication and authorization

servers:
  - url: https://auth.abcdery.com
    description: Auth server

paths:
  /request-otp:
    post:
      summary: Request OTP for login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
                phone:
                  type: string
              required:
                - country_code
                - phone
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  status:
                    type: int
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /login:
    post:
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
                phone:
                  type: string
                otp:
                  type: string
              required:
                - country_code
                - phone
                - otp
      responses:
        "200":
          description: Successful login
          headers:
            Set-Cookie:
              description: |
                Sets `access_token` and `refresh_token` cookies.
                HttpOnly, Secure, SameSite=Strict
              schema:
                type: array
                items:
                  type: string
                example:
                  - access_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
                  - refresh_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
                  status:
                    type: int
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /logout:
    post:
      summary: User logout
      security:
        - authCookie: []
          refreshCookie: []
      responses:
        "200":
          description: Successfully logged out
          headers:
            Set-Cookie:
              description: |
                Clears `access_token` and `refresh_token` cookies by setting them
                with an expired date and Max-Age=0.
              schema:
                type: array
                items:
                  type: string
                example:
                  - access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; HttpOnly; Secure; SameSite=Strict
                  - refresh_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  status:
                    type: int
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /refresh:
    post:
      summary: Refresh tokens
      security:
        - refreshCookie: []
      responses:
        "200":
          description: issues a new set of tokens and refetches the metadata
          headers:
            Set-Cookie:
              description: |
                Sets `access_token` and `refresh_token` cookies.
                HttpOnly, Secure, SameSite=Strict
              schema:
                type: array
                items:
                  type: string
                example:
                  - access_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
                  - refresh_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
                  status:
                    type: int
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /school-admin/metadata:
    post:
      summary: School Admin Metadata
      security:
        - authCookie: []
      responses:
        "200":
          description: metadata fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    description: user metadata
                    additionalProperties: true
                  status:
                    type: int
        "400":
          description: Bad request
        "401":
          description: Unauthorized

components:
  securitySchemes:
    authCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token