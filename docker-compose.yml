services:
  governance:
    container_name: governance
    build:
      context: .
      dockerfile: Dockerfile.governance
    ports:
      - ${GOVERNANCE_HTTP_PORT}:${GOVERNANCE_HTTP_PORT}
      - ${GOVERNANCE_GRPC_PORT}:${GOVERNANCE_GRPC_PORT}
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    networks:
      - governance_network
    volumes:
      - ./configs:/root/configs
    labels:
      - "log-type=json"
      - "service=governance"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: "redis:7.4.2"
    container_name: redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis_data:/data
    networks:
      - governance_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

  mongo:
    image: "mongodb/mongodb-community-server:8.0.8-ubuntu2204"
    container_name: mongo
    ports:
      - ${MONGO_PORT}:${MONGO_PORT}
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_INITDB_ROOT_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - governance_network

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - governance_network

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - governance_network
    command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/promtail.yaml:ro
    networks:
      - governance_network
    command: -config.file=/etc/promtail/promtail.yaml

  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: prometheus
    ports:
      - "9000:9000"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    networks:
      - governance_network


volumes:
  redis_data:
  mongo_data:
  grafana_data:
  loki_data:

networks:
  governance_network:
    driver: bridge