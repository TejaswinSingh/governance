services:
  governance:
    container_name: governance
    build:
      context: .
      dockerfile: Dockerfile.governance
    ports:
      - ${GOVERNANCE_HTTP_PORT}:${GOVERNANCE_HTTP_PORT}
      - ${GOVERNANCE_GRPC_PORT}:${GOVERNANCE_GRPC_PORT}
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - governance_network
    volumes:
      - ./config:/root/config
    command: ["/root/governance"]

  redis:
    image: "redis:7.4.2"
    container_name: redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis_data:/data
    networks:
      - governance_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

volumes:
  redis_data:

networks:
  governance_network:
    driver: bridge