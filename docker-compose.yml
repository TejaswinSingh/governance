services:
  governance:
    container_name: governance
    build:
      context: .
      dockerfile: Dockerfile.governance
    ports:
      - ${GOVERNANCE_HTTP_PORT}:${GOVERNANCE_HTTP_PORT}
      - ${GOVERNANCE_GRPC_PORT}:${GOVERNANCE_GRPC_PORT}
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    networks:
      - governance_network
    volumes:
      - ./configs:/root/configs
    labels:
      - "log-type=json"
      - "service=governance"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: "redis:7.4.2"
    container_name: redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis_data:/data
    networks:
      - governance_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

  mongo:
    image: "mongodb/mongodb-community-server:8.0.8-ubuntu2204"
    container_name: mongo
    ports:
      - ${MONGO_PORT}:${MONGO_PORT}
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_INITDB_ROOT_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - governance_network
      
volumes:
  redis_data:
  mongo_data:

networks:
  governance_network:
    driver: bridge